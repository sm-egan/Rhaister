# Dataset paths - maps dataset names to their directories
[datasets]
parse = "/data/parse_final_concat"

# Training specifications
# All cell types in a dataset automatically go into training (excluding zeroshot/fewshot overrides)
[training]
parse = "train"

# Zeroshot specifications - entire cell types go to val or test
[zeroshot]

# Fewshot specifications.
# donor_split_0: holds out Donor1 across all 18 cell types, reusing split_0's
# val/test cytokine partition. The `donors` field on each cell_type entry is
# expanded by load_split into composite Donor1__<cell_type> cell_lines.
[fewshot]
[fewshot."parse.B_Intermediate_Memory"]
donors = ["Donor1", "Donor4", "Donor9", "Donor12"]
val = ['G-CSF', 'IFN-beta', 'M-CSF', 'IGF-1']
