# Parse PBMC cytokine screen — portable dataset definition.
# Data paths are relative to the dataset root. Set RHAISTER_DATA_ROOT to point
# at a directory with per-dataset subdirectories (e.g. $ROOT/parse/pdex/...).
# Without RHAISTER_DATA_ROOT, data is auto-downloaded from HuggingFace.

[data]
pdex_path      = "pdex/all_celltypes_pdex.parquet"
cell_eval_path = "cell_eval/all_celltypes_delta.parquet"

# The observation unit is (donor, cell_type); compose it into `cell_line`, and
# rename cell_eval's `cytokine` column to the loader's `treatment`.
[data.columns]
cell_line           = ["donor", "cell_type"]
cell_eval_treatment = "cytokine"

# A/B independent sub-samples for noise-ceiling calibration (scripts/eval_a_vs_b.py).
[data.variants.A]
pdex_path      = "a_vs_b/A/pdex/all_celltypes_pdex.parquet"
cell_eval_path = "a_vs_b/A/cell_eval/all_celltypes_delta.parquet"

[data.variants.B]
pdex_path      = "a_vs_b/B/pdex/all_celltypes_pdex.parquet"
cell_eval_path = "a_vs_b/B/cell_eval/all_celltypes_delta.parquet"

[genes]
static_list = "static_2k_genes.json"

[splits]
default_config = "split.toml"
